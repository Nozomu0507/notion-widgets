<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Calendar Widget</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet" />
<style>
  /*
    カレンダーウィジェット（Notion埋め込み用）
    - 日本の祝日を表示（取得できないときは土日だけ色分け）
    - ?start=mon で月曜始まり  ?theme=dark でダーク表示  &accent=337EA9
  */
  :root {
    --accent: #337EA9;
    --bg: #ffffff;
    --panel: #f7f8fa;
    --line: rgba(15, 30, 50, 0.08);
    --text: #1f2328;
    --sub: #8a8f98;
    --hover: rgba(15, 30, 50, 0.06);
    --sun: #d1495b;
    --sat: #337EA9;
  }
  :root[data-theme="dark"] {
    --bg: #191919;
    --panel: #202122;
    --line: rgba(255, 255, 255, 0.08);
    --text: #ecedee;
    --sub: #8e9196;
    --hover: rgba(255, 255, 255, 0.06);
    --sun: #e2707e;
    --sat: #6aa7cf;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); }
  body {
    font-family: "Space Grotesk", "Noto Sans JP", -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    color: var(--text);
    padding: 6px;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    height: 100%;
    min-height: 220px;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: var(--panel);
    padding: 16px 18px 14px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .head { display: flex; align-items: center; justify-content: space-between; }
  .label { font-family: "Noto Sans JP", sans-serif; font-size: 11px; letter-spacing: 0.2em; color: var(--accent); font-weight: 500; }
  .nav { display: flex; align-items: center; gap: 2px; }
  .nav button {
    width: 24px; height: 24px; border: 0; border-radius: 6px; background: none; color: var(--sub);
    cursor: pointer; display: grid; place-items: center;
  }
  .nav button:hover { background: var(--hover); color: var(--text); }
  .nav svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .month { font-size: 15px; font-weight: 500; margin: 8px 0 8px; font-family: "Noto Sans JP", sans-serif; cursor: pointer; }
  .month b { font-family: "Space Grotesk", sans-serif; font-size: 22px; font-weight: 500; margin-right: 1px; }
  .grid { flex: 1; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); grid-auto-rows: 1fr; row-gap: 2px; }
  .wd { font-family: "Noto Sans JP", sans-serif; font-size: 10.5px; color: var(--sub); text-align: center; align-self: center; }
  .d {
    font-size: 12.5px; display: grid; place-items: center; position: relative;
    font-variant-numeric: tabular-nums;
  }
  .d span { width: 26px; height: 26px; display: grid; place-items: center; border-radius: 50%; }
  .d.out { color: var(--sub); opacity: .45; }
  .d.sun, .wd.sun, .d.hol { color: var(--sun); }
  .d.sat, .wd.sat { color: var(--sat); }
  .d.today span { background: var(--accent); color: #fff; font-weight: 600; }
  .d[title]::after { content: ""; position: absolute; bottom: 1px; width: 3px; height: 3px; border-radius: 50%; background: var(--sun); }
  .d.today[title]::after { background: var(--accent); }
  .holi { display: none; font-family: "Noto Sans JP", sans-serif; font-size: 11px; color: var(--sub); margin-top: 6px; min-height: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
<div class="card">
  <div class="head">
    <div class="label">カレンダー</div>
    <div class="nav">
      <button type="button" id="prev" aria-label="前の月"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
      <button type="button" id="next" aria-label="次の月"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>
  </div>
  <div class="month" id="month" title="今月に戻る"></div>
  <div class="grid" id="grid"></div>
  <div class="holi" id="holi"></div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  document.documentElement.dataset.theme = q.get("theme") === "dark" ? "dark" : "light";
  if (/^[0-9a-fA-F]{6}$/.test(q.get("accent") || "")) document.documentElement.style.setProperty("--accent", "#" + q.get("accent"));
  const MON = q.get("start") === "mon";
  const $ = (id) => document.getElementById(id);
  const pad = (n) => String(n).padStart(2, "0");
  const WD = MON ? ["月", "火", "水", "木", "金", "土", "日"] : ["日", "月", "火", "水", "木", "金", "土"];
  let holidays = {};
  let view = new Date(); view.setDate(1);

  function key(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }

  function render() {
    const today = new Date();
    const y = view.getFullYear(), m = view.getMonth();
    $("month").innerHTML = "<b>" + y + "</b>年 <b>" + (m + 1) + "</b>月";
    const first = new Date(y, m, 1);
    const offset = MON ? (first.getDay() + 6) % 7 : first.getDay();
    const start = new Date(y, m, 1 - offset);
    const weeks = Math.ceil((offset + new Date(y, m + 1, 0).getDate()) / 7);
    let html = WD.map((w) => '<div class="wd' + (w === "日" ? " sun" : w === "土" ? " sat" : "") + '">' + w + "</div>").join("");
    const names = [];
    for (let i = 0; i < weeks * 7; i++) {
      const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
      const cls = ["d"];
      if (d.getMonth() !== m) cls.push("out");
      if (d.getDay() === 0) cls.push("sun");
      if (d.getDay() === 6) cls.push("sat");
      const hol = holidays[key(d)];
      if (hol) { cls.push("hol"); if (d.getMonth() === m) names.push((d.getDate()) + "日 " + hol); }
      if (key(d) === key(today)) cls.push("today");
      html += '<div class="' + cls.join(" ") + '"' + (hol ? ' title="' + hol + '"' : "") + "><span>" + d.getDate() + "</span></div>";
    }
    $("grid").innerHTML = html;
    $("holi").textContent = names.join("　");
  }

  $("prev").onclick = () => { view = new Date(view.getFullYear(), view.getMonth() - 1, 1); render(); };
  $("next").onclick = () => { view = new Date(view.getFullYear(), view.getMonth() + 1, 1); render(); };
  $("month").onclick = () => { view = new Date(); view.setDate(1); render(); };

  render();
  // 日本の祝日（holidays-jp）
  fetch("https://holidays-jp.github.io/api/v1/date.json")
    .then((r) => r.json())
    .then((j) => { holidays = j; render(); })
    .catch(() => {});
  // 日付が変わったら描き直す
  let last = new Date().getDate();
  setInterval(() => { const n = new Date().getDate(); if (n !== last) { last = n; render(); } }, 60000);
</script>
</body>
</html>
